apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: agentic-platform
  labels:
    app: pgbouncer
    tier: database-pooler
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        tier: database-pooler
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgbouncer
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          image: edoburu/pgbouncer:1.22.1-p0@sha256:7f39cf2f872c8d9a0bb0e6a5440c3bf5814036eccf284102870ab08e2603a2c7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: DB_HOST
              value: "postgres-svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: agentic-database-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agentic-database-secrets
                  key: POSTGRES_PASSWORD
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_PREPARED_STATEMENTS
              value: "100"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "50"
            - name: RESERVE_POOL_SIZE
              value: "10"
            - name: SERVER_RESET_QUERY
              value: "DISCARD ALL"
            - name: IGNORE_STARTUP_PARAMETERS
              value: "extra_float_digits"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # readOnlyRootFilesystem=true: provide explicit writable scratch space.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: pgbouncer-run
              mountPath: /var/run/pgbouncer
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: pgbouncer-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-svc
  namespace: agentic-platform
  labels:
    app: pgbouncer
spec:
  type: ClusterIP
  selector:
    app: pgbouncer
  ports:
    - port: 6432
      targetPort: 5432
      name: postgres
