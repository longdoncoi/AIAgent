# ==============================================================================
# Self-Contained Model Serving & Gateway Stack (vLLM, Embedding, LiteLLM Proxy)
# ------------------------------------------------------------------------------
# Included directly in deploy/k8s/kustomization.yaml so base manifests are
# complete and deploy/docs runbook references (e.g. deployment/vllm) resolve.
# Override GPU resources / replicas / model images via production Kustomize overlay.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: agentic-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: vllm
    tier: l7-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
        tier: l7-serving
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.7.3@sha256:4f4037303e8c7b69439db1077bb849a0823517c0f785b894dc8e96d58ef3a0c2
          imagePullPolicy: IfNotPresent
          args:
            - "--model"
            - "Qwen/Qwen2.5-72B-Instruct"
            - "--port"
            - "8001"
            - "--max-model-len"
            - "32768"
            - "--tensor-parallel-size"
            - "4"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "hermes"
            - "--enable-prefix-caching"
          ports:
            - containerPort: 8001
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 4
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-svc
  namespace: agentic-platform
  labels:
    app: vllm
    tier: l7-serving
spec:
  selector:
    app: vllm
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-coding
  namespace: agentic-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm-coding}
  template:
    metadata:
      labels: {app: vllm-coding, tier: l7-serving}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vllm-coding
          image: vllm/vllm-openai:v0.7.3@sha256:4f4037303e8c7b69439db1077bb849a0823517c0f785b894dc8e96d58ef3a0c2
          args:
            - "--model"
            - "Qwen/Qwen2.5-Coder-32B-Instruct"
            - "--port"
            - "8002"
            - "--tensor-parallel-size"
            - "2"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser"
            - "hermes"
            - "--enable-prefix-caching"
          ports: [{containerPort: 8002, name: http}]
          readinessProbe: {tcpSocket: {port: 8002}, initialDelaySeconds: 30, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: "2", memory: "8Gi"}
            limits: {cpu: "8", memory: "32Gi", nvidia.com/gpu: 2}
---
apiVersion: v1
kind: Service
metadata: {name: vllm-coding-svc, namespace: agentic-platform}
spec:
  selector: {app: vllm-coding}
  ports: [{port: 8002, targetPort: 8002, protocol: TCP, name: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentic-model-cache
  namespace: agentic-platform
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: efs-sc
  resources:
    requests: {storage: 100Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-fast
  namespace: agentic-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels: {app: llama-fast}
  template:
    metadata:
      labels: {app: llama-fast, tier: l7-serving}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: llama-fast
          image: ghcr.io/ggml-org/llama.cpp:server-b5350@sha256:8a0a31d0b342f96b2c5453eedadbb0544d6d426bd43c9ea6f62b2bd2489be676
          args: ["--host", "0.0.0.0", "--port", "8080", "--model", "/models/Qwen2.5-14B-Instruct-Q4_K_M.gguf"]
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {tcpSocket: {port: 8080}, initialDelaySeconds: 20, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          resources:
            requests: {cpu: "2", memory: "8Gi"}
            limits: {cpu: "8", memory: "20Gi"}
          volumeMounts: [{name: models, mountPath: /models, readOnly: true}]
      volumes: [{name: models, persistentVolumeClaim: {claimName: agentic-model-cache}}]
---
apiVersion: v1
kind: Service
metadata: {name: llama-fast-svc, namespace: agentic-platform}
spec:
  selector: {app: llama-fast}
  ports: [{port: 8080, targetPort: 8080, protocol: TCP, name: http}]
---
