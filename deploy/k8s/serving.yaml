  namespace: agentic-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: embedding
    tier: l7-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embedding
  template:
    metadata:
      labels:
        app: embedding
        tier: l7-serving
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: embedding
          image: ghcr.io/ggml-org/llama.cpp:server-b5350@sha256:8a0a31d0b342f96b2c5453eedadbb0544d6d426bd43c9ea6f62b2bd2489be676
          imagePullPolicy: IfNotPresent
          args:
            - "--host"
            - "0.0.0.0"
