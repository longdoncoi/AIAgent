      targetPort: 8081
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: agentic-platform
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: litellm
    tier: l7-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        tier: l7-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-v1.63.0@sha256:9beb998780c7172d164e8c9fcfa82479efe3d64401ac1deecaead7405f88f5f5
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "2"]
          env:
            - {name: REASONING_LLM_API_BASE, value: "http://vllm-svc:8001/v1"}
            - {name: FAST_LLM_API_BASE, value: "http://llama-fast-svc:8080/v1"}
            - {name: CODING_LLM_API_BASE, value: "http://vllm-coding-svc:8002/v1"}
            - {name: LLAMA_BACKUP_API_BASE, value: "http://llama-chat-backup-svc:8080/v1"}
            - {name: EMBEDDING_API_BASE, value: "http://embedding-svc:8081/v1"}
          ports:
            - containerPort: 4000
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: litellm-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: litellm-config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-svc
  namespace: agentic-platform
  labels:
    app: litellm
    tier: l7-gateway
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model-serving
  namespace: agentic-platform
spec:
  podSelector:
    matchLabels:
      tier: l7-serving
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: l7-gateway
        - podSelector:
            matchLabels:
              tier: l3-agent
        - podSelector:
            matchLabels:
              app: agentic-api
        - podSelector:
            matchLabels:
              tier: maintenance
      ports:
        - {protocol: TCP, port: 8001}
        - {protocol: TCP, port: 8081}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-gateway
  namespace: agentic-platform
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agentic-api
        - podSelector:
            matchLabels:
              tier: l3-agent
        - podSelector:
            matchLabels:
              app: agentic-temporal-worker
      ports:
        - {protocol: TCP, port: 4000}
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: l7-serving
      ports:
        - {protocol: TCP, port: 8001}
        - {protocol: TCP, port: 8081}
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
            except: ["169.254.169.254/32"]
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 8001}
        - {protocol: TCP, port: 8002}
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
