# ==============================================================================
# Istio Service Mesh Zero-Trust Security & mTLS Policies
# ==============================================================================

apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: agentic-platform
spec:
  # Enforce STRICT mutual TLS for all service-to-service communications
  mtls:
    mode: STRICT
---
# ------------------------------------------------------------------------------
# 1. AuthorizationPolicy: Ingress to L1 API
# ------------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-api
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      app: agentic-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/ingress-nginx/sa/ingress-nginx"
      to:
        - operation:
            ports: ["8000"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["8000"]
            methods: ["GET"]
            paths: ["/metrics"]
---
# ------------------------------------------------------------------------------
# 2. AuthorizationPolicy: L1 API / Temporal Worker & Prometheus to L3 Sub-Agents
# ------------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-api-to-subagents
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      tier: l3-agent
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentic-platform/sa/agentic-api-sa"
              - "cluster.local/ns/agentic-platform/sa/agentic-temporal-worker-sa"
      to:
        - operation:
            ports: ["9100", "9101", "9102"]
            methods: ["POST", "GET"]
    - from:
        - source:
            namespaces: ["monitoring"]
      to:
        - operation:
            ports: ["9100", "9101", "9102"]
            methods: ["GET"]
            paths: ["/metrics"]
---
# ------------------------------------------------------------------------------
# 3. AuthorizationPolicy: L3 Agents to L4 MCP Tools (least-privilege per tool)
# ------------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-agents-to-mcp-tools
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      tier: l4-tools
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentic-platform/sa/agentic-coding-agent-sa"
      to:
        - operation:
            ports: ["9001", "9002"]
            methods: ["POST", "GET"]
    - from:
        - source:
            principals:
              - "cluster.local/ns/agentic-platform/sa/agentic-chat-agent-sa"
      to:
        - operation:
            ports: ["9003"]
            methods: ["POST", "GET"]
# Sandbox egress isolation is intentionally implemented by
# sandbox-network-policy.yaml. Istio AuthorizationPolicy is evaluated on the
# destination workload's inbound path and cannot express a source-side egress
# deny; the previous policy therefore advertised protection it did not provide.
