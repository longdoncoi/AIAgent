# ==============================================================================
# Istio Service Mesh Zero-Trust Security & mTLS Policies
# ==============================================================================

apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default-strict-mtls
  namespace: agentic-platform
spec:
  # Enforce STRICT mutual TLS for all service-to-service communications
  mtls:
    mode: STRICT
---
# ------------------------------------------------------------------------------
# 1. AuthorizationPolicy: Ingress to L1 API
# ------------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-api
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      app: agentic-api
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"]
      to:
        - operation:
            ports: ["8000"]
---
# ------------------------------------------------------------------------------
# 2. AuthorizationPolicy: L1 API to L3 Sub-Agents (A2A Protocol)
# ------------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-api-to-subagents
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      tier: l3-agent
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/agentic-platform/sa/agentic-api-sa"]
      to:
        - operation:
            ports: ["9100", "9101", "9102"]
            methods: ["POST", "GET"]
---
# ------------------------------------------------------------------------------
# 3. AuthorizationPolicy: CodingAgent to repository and code-execution MCP tools
# ------------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-coding-agent-to-coding-mcp
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      app: agentic-mcp-code-exec
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/agentic-platform/sa/agentic-coding-agent-sa"]
      to:
        - operation:
            ports: ["9001"]
            methods: ["POST", "GET"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-coding-agent-to-repo-mcp
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      app: agentic-mcp-repo
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/agentic-platform/sa/agentic-coding-agent-sa"]
      to:
        - operation:
            ports: ["9002"]
            methods: ["POST", "GET"]
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-chat-agent-to-web-search-mcp
  namespace: agentic-platform
spec:
  selector:
    matchLabels:
      app: agentic-mcp-web-search
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/agentic-platform/sa/agentic-chat-agent-sa"]
      to:
        - operation:
            ports: ["9003"]
            methods: ["POST", "GET"]
---
# ------------------------------------------------------------------------------
# 4. AuthorizationPolicy: Strict Deny for Sandbox Pods accessing Cluster Network
# ------------------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-sandbox-egress-to-internal
  namespace: agentic-sandbox
spec:
  selector:
    matchLabels:
      sandbox: untrusted
  action: DENY
  rules:
    - to:
        - operation:
            ports: ["5432", "6379", "6333", "7233", "8000", "9100", "9101", "9102"]
