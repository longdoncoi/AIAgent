apiVersion: batch/v1
kind: CronJob
metadata:
  name: agentic-checkpoint-retention
  namespace: agentic-platform
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 900
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: agentic-checkpoint-retention
            tier: maintenance
        spec:
          serviceAccountName: agentic-api-sa
          automountServiceAccountToken: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: checkpoint-retention
              image: ghcr.io/agentic-platform/api:IMMUTABLE_SHA_REQUIRED
              imagePullPolicy: IfNotPresent
              command: ["python", "scripts/cleanup_checkpoints.py"]
              args: ["--max-idle-seconds", "2592000"]
              env:
                - name: SERVICE_ROLE
                  value: "maintenance"
              envFrom:
                - configMapRef:
                    name: agentic-config
                - secretRef:
                    name: agentic-maintenance-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
