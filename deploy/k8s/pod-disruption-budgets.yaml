# ==============================================================================
# PodDisruptionBudgets: guarantee voluntary-disruption headroom during drains,
# node upgrades and cluster autoscaling. All workloads with replicas >= 2.
# ==============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agentic-api-pdb
  namespace: agentic-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agentic-api
---
