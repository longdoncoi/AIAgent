# ==============================================================================
# ExternalSecrets Operator Integration (HashiCorp Vault / Cloud KMS Integration)
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: agentic-vault-store
  namespace: agentic-platform
spec:
  provider:
    vault:
      server: "https://vault.internal.infra:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "agentic-platform-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentic-platform-secrets
  namespace: agentic-platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: agentic-vault-store
    kind: SecretStore
  target:
    name: agentic-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: agentic/production
        property: jwt_secret_key
    - secretKey: S2S_INTERNAL_TOKEN
      remoteRef:
        key: agentic/production
        property: s2s_internal_token
    # Dedicated HITL signing key; must never be derived from the S2S token.
    - secretKey: APPROVAL_SIGNING_KEY
      remoteRef:
        key: agentic/production
        property: approval_signing_key
    # Real Vault-managed key, not the sk-dummy-key dev placeholder.
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: agentic/production
        property: litellm_api_key
    # PostgreSQL credentials consumed by pgbouncer.yaml and by the applications
    # (POSTGRES_URI must NOT live in a ConfigMap).
    - secretKey: POSTGRES_USER
      remoteRef:
        key: agentic/production
        property: postgres_user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: agentic/production
        property: postgres_password
    - secretKey: POSTGRES_URI
      remoteRef:
        key: agentic/production
        property: postgres_uri
    # No Neo4j workload exists, but production validation rejects the default
    # placeholder unconditionally: provision a real Vault-managed value.
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: agentic/production
        property: neo4j_password
