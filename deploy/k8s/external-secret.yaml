# ==============================================================================
# ExternalSecrets Operator Integration (HashiCorp Vault / Cloud KMS Integration)
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: agentic-vault-store
  namespace: agentic-platform
spec:
  provider:
    vault:
      server: "https://vault.internal.infra:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "agentic-platform-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentic-platform-secrets
  namespace: agentic-platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: agentic-vault-store
    kind: SecretStore
  target:
    name: agentic-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: agentic/production
        property: jwt_secret_key
    - secretKey: S2S_INTERNAL_TOKEN
      remoteRef:
        key: agentic/production
        property: s2s_internal_token
    - secretKey: LITELLM_API_KEY
      remoteRef:
        key: agentic/production
        property: litellm_api_key
    - secretKey: LITELLM_BASE_URL
      remoteRef:
        key: agentic/production
        property: litellm_base_url
    - secretKey: LLAMA_EMBED_BASE_URL
      remoteRef:
        key: agentic/production
        property: llama_embed_base_url
    - secretKey: POSTGRES_URI
      remoteRef:
        key: agentic/production
        property: postgres_uri_pgbouncer
    - secretKey: POSTGRES_HOST
      remoteRef:
        key: agentic/production
        property: postgres_host
    - secretKey: POSTGRES_USER
      remoteRef:
        key: agentic/production
        property: postgres_user
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: agentic/production
        property: postgres_password
    - secretKey: POSTGRES_DB
      remoteRef:
        key: agentic/production
        property: postgres_database
    - secretKey: REDIS_URL
      remoteRef:
        key: agentic/production
        property: redis_url
    - secretKey: QDRANT_HOST
      remoteRef:
        key: agentic/production
        property: qdrant_host
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: agentic/production
        property: qdrant_api_key
