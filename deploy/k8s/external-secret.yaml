# ==============================================================================
# External Secrets Operator integration
#
# Least privilege is enforced at the Kubernetes Secret boundary.  The
# supervisor is the only workload that receives the Ed25519 private key;
# agents and MCP servers receive only the public verifier key.
# ==============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: agentic-vault-store
  namespace: agentic-platform
spec:
  provider:
    vault:
      server: "https://vault.internal.infra:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "agentic-platform-role"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentic-api-secrets
  namespace: agentic-platform
spec:
  refreshInterval: "1h"
  secretStoreRef: {name: agentic-vault-store, kind: SecretStore}
  target: {name: agentic-api-secrets, creationPolicy: Owner}
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef: {key: agentic/production, property: jwt_secret_key}
    - secretKey: S2S_INTERNAL_TOKEN
      remoteRef: {key: agentic/production, property: s2s_internal_token}
    - secretKey: APPROVAL_PRIVATE_KEY
      remoteRef: {key: agentic/production, property: approval_ed25519_private_key}
    - secretKey: LITELLM_API_KEY
      remoteRef: {key: agentic/production, property: litellm_api_key}
    - secretKey: POSTGRES_URI
      remoteRef: {key: agentic/production, property: postgres_uri}
    - secretKey: QDRANT_API_KEY
      remoteRef: {key: agentic/production, property: qdrant_api_key}
---
apiVersion: external-secrets.io/v1beta1
