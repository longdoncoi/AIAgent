# ==============================================================================
# ArgoCD GitOps Application Definition (Zero-Downtime Continuous Delivery)
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agentic-platform-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: agentic-platform
    env: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/agentic-platform/agentic-platform.git'
    targetRevision: main
    path: deploy/k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
