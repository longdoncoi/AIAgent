# ==============================================================================
# Kustomize Base Definition for Agentic Multi-Agent Platform
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - service-accounts.yaml
  - sandbox-network-policy.yaml
  - sandbox-rbac.yaml
  - deployment.yaml
  - configmap-secrets.yaml
  - external-secret.yaml
  - network-policy.yaml
  - ingress.yaml
  - pgbouncer.yaml
  - istio-security.yaml

transformers:
  - namespace-transformer.yaml
