# ==============================================================================
# Shared Scratch Workspace PVC for MCP Repo & Code Exec Servers
# Lets CodingAgent write/read workspace files across isolated MCP Pods.
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agentic-mcp-scratch
  namespace: agentic-platform
  labels:
    app: agentic-mcp-repo
    tier: l4-tools
spec:
  # Explicit RWX storage class prevents Pending PVCs on clusters without a default RWX provisioner.
  # Override in deploy/overlays/production for cluster-specific CSI drivers (e.g. azurefile-csi, cephfs).
  storageClassName: efs-sc
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
