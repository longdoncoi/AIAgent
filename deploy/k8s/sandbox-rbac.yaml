apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-sandbox-runner
  namespace: agentic-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/attach"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-mcp-sandbox-runner
  namespace: agentic-sandbox
subjects:
  - kind: ServiceAccount
    name: agentic-mcp-code-exec-sa
    namespace: agentic-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentic-sandbox-runner
