apiVersion: v1
kind: ConfigMap
metadata:
  name: agentic-config
  namespace: agentic-platform
  labels:
    app: agentic-platform
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DEBUG: "false"
  REQUIRE_AUTHENTICATION: "true"
  USE_POSTGRES_CHECKPOINT: "true"
  USE_REMOTE_MCP: "true"
  ALLOW_LOCAL_AGENT_FALLBACK: "false"
  ALLOW_HOST_CODE_EXECUTION: "false"
  ENABLE_K8S_SANDBOX: "true"
  K8S_SANDBOX_NAMESPACE: "agentic-sandbox"
  # No Neo4j workload is deployed by this platform; keep KG disabled.
  ENABLE_KNOWLEDGE_GRAPH: "false"
  ENABLE_GUARDRAILS: "true"
  PII_REDACTION_ENABLED: "true"
  ENABLE_RAG_CACHE: "true"
  ENABLE_PROMPT_CACHE: "true"
  ENABLE_KV_CACHE_PREFIX_OPTIMIZATION: "true"
  RATE_LIMIT_PER_MINUTE: "120"
  # X-Forwarded-For is trusted ONLY when the direct TCP peer is in this narrow
  # list; otherwise every client shares one rate-limit bucket. 127.0.0.1/32
  # covers the Istio sidecar hop, 10.96.0.0/12 the Kubernetes service CIDR
  # hosting ingress gateways. ADJUST to the cluster's real ingress subnet.
  # JSON array (pydantic-settings parses list[str] env values as JSON).
  TRUSTED_PROXIES: '["127.0.0.1/32", "10.96.0.0/12"]'
  ENABLE_REDIS_RATE_LIMIT: "true"
  REDIS_URL: "redis://redis-master:6379/0"
  # SECURITY: DB credentials / DSN are NOT stored in ConfigMaps.
  # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_URI are injected from the
  # ESO-managed Secret `agentic-secrets` (see external-secret.yaml).
  QDRANT_HOST: "qdrant-svc"
  QDRANT_PORT: "6333"
  QDRANT_SHARD_NUMBER: "2"
  QDRANT_REPLICATION_FACTOR: "2"
  QDRANT_WRITE_CONSISTENCY_FACTOR: "1"
  A2A_MAX_RETRIES: "3"
  A2A_MAX_CONCURRENT_REQUESTS: "100"
  LITELLM_BASE_URL: "http://litellm-svc:4000/v1"
  A2A_CHAT_AGENT_URL: "http://agentic-chat-svc:9100/a2a"
  A2A_RAG_AGENT_URL: "http://agentic-rag-svc:9101/a2a"
  A2A_CODING_AGENT_URL: "http://agentic-coding-svc:9102/a2a"
  MCP_CODE_EXEC_URL: "http://agentic-mcp-code-exec-svc:9001/sse"
  MCP_REPO_URL: "http://agentic-mcp-repo-svc:9002/sse"
  MCP_WEB_SEARCH_URL: "http://agentic-mcp-web-search-svc:9003/sse"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-svc:4317"
