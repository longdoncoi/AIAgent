              value: "9101"
            - name: HF_HOME
              value: "/opt/hf-cache"
            - name: HF_HUB_OFFLINE
              value: "1"
          envFrom:
            - configMapRef:
                name: agentic-config
            - secretRef:
                name: agentic-rag-secrets
          ports:
            - containerPort: 9101
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 9101
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 9101
            initialDelaySeconds: 5
            periodSeconds: 5
