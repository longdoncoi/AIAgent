# ==============================================================================
# Agentic Platform Kubernetes Manifests (Production Decoupled Microservices)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. L1 Interface: Agentic API (Supervisor & Web Interface)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-api
  labels:
    app: agentic-api
    tier: l1-interface
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-api
  template:
    metadata:
      labels:
        app: agentic-api
        tier: l1-interface
    spec:
      serviceAccountName: agentic-api-sa
      containers:
        - name: api
          image: ghcr.io/longdoncoi/aiagent/api@sha256:b990e582e0ce236b3a3e1bff7e59cc4f63200aea89d270fce3730ef0a6b467ac
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentic-config
            - secretRef:
                name: agentic-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-api-svc
spec:
  type: ClusterIP
  selector:
    app: agentic-api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentic-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentic-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ------------------------------------------------------------------------------
# 2. L3 Sub-Agent: ChatAgent Microservice
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-chat-agent
  labels:
    app: agentic-chat-agent
    tier: l3-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-chat-agent
  template:
    metadata:
      labels:
        app: agentic-chat-agent
        tier: l3-agent
    spec:
      serviceAccountName: agentic-chat-agent-sa
      containers:
        - name: chat-agent
          image: ghcr.io/longdoncoi/aiagent/agent@sha256:7c2a868c54ad58468f1ca17c285d5577f0d4b2accdb463bf4e6db24289268d1b
          env:
            - name: AGENT_MODULE
              value: "src.agentic.agents.chat.server"
            - name: AGENT_PORT
              value: "9100"
          envFrom:
            - configMapRef:
                name: agentic-config
            - secretRef:
                name: agentic-secrets
          ports:
            - containerPort: 9100
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9100
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /.well-known/agent-card.json
              port: 9100
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-chat-svc
spec:
  type: ClusterIP
  selector:
    app: agentic-chat-agent
  ports:
    - port: 9100
      targetPort: 9100
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentic-chat-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentic-chat-agent
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
