        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: agentic-rag-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rag-data
          persistentVolumeClaim:
            claimName: agentic-rag-data
      containers:
        - name: rag-agent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rag-data
              mountPath: /app/data/raw
              subPath: raw
              readOnly: true
            - name: rag-data
              mountPath: /app/data/index
              subPath: index
              readOnly: true
          image: ghcr.io/agentic-platform/agent:IMMUTABLE_SHA_REQUIRED
          env:
