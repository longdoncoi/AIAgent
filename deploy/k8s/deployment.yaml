# ------------------------------------------------------------------------------
# 5. L4 FastMCP Tools Microservices
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-mcp-code-exec
  namespace: agentic-platform
  labels:
    app: agentic-mcp-code-exec
    tier: l4-tools
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-mcp-code-exec
  template:
    metadata:
      labels:
        app: agentic-mcp-code-exec
        tier: l4-tools
    spec:
      serviceAccountName: agentic-mcp-code-exec-sa
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: agentic-mcp-code-exec
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: scratch-dir
          persistentVolumeClaim:
            claimName: agentic-mcp-scratch
      containers:
        - name: mcp-code-exec
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: scratch-dir
              mountPath: /app/data/scratch
          image: ghcr.io/agentic-platform/mcp:IMMUTABLE_SHA_REQUIRED
          env:
            - name: SERVICE_ROLE
              value: "mcp"
            - name: MCP_SERVER_MODULE
              value: "src.agentic.tools.servers.code_exec_server"
            - name: MCP_PORT
              value: "9001"
            - name: MCP_TRANSPORT
              value: "streamable-http"
          envFrom:
            - configMapRef:
                name: agentic-config
            - secretRef:
                name: agentic-mcp-secrets
          ports:
            - containerPort: 9001
          # FastMCP servers have no HTTP /health route and require the internal
          # service token on HTTP routes: auth-free TCP probes + slow-start probe.
          livenessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 9001
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            tcpSocket:
              port: 9001
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-mcp-code-exec-svc
  namespace: agentic-platform
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 1800
  selector:
    app: agentic-mcp-code-exec
  ports:
    - name: mcp
      port: 9001
      targetPort: 9001
---
