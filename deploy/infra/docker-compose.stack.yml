# ==============================================================================
# Reference Backing-Services Stack (PostgreSQL, Redis Cache + State, Qdrant,
# Temporal, LiteLLM) for Staging / Integration Environments.
# Production clusters should use managed HA equivalents + ExternalSecrets.
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    environment:
      POSTGRES_DB: agentic_db
      POSTGRES_USER: ${POSTGRES_USER:-agentic_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic_migrator} -d agentic_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]

  redis-state:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["6380:6379"]
    volumes:
      - redis-state-data:/data

  qdrant:
    image: qdrant/qdrant:v1.13.4@sha256:318c11b72aaab96b36e9662ad244de3cabd0653a1b942d4e8191f18296c81af0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant-data:/qdrant/storage

  temporal:
    image: temporalio/auto-setup:1.25.2@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-agentic_migrator}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["7233:7233"]

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.63.0@sha256:9beb998780c7172d164e8c9fcfa82479efe3d64401ac1deecaead7405f88f5f5
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ../../configs/litellm_config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REASONING_LLM_API_BASE: ${REASONING_LLM_API_BASE:-http://host.docker.internal:8001/v1}
      FAST_LLM_API_BASE: ${FAST_LLM_API_BASE:-http://host.docker.internal:8080/v1}
      CODING_LLM_API_BASE: ${CODING_LLM_API_BASE:-http://host.docker.internal:8002/v1}
      LLAMA_BACKUP_API_BASE: ${LLAMA_BACKUP_API_BASE:-http://host.docker.internal:8080/v1}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:8081/v1}
    ports: ["4000:4000"]

volumes:
  pg-data:
  redis-state-data:
  qdrant-data:
