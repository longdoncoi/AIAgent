# ==============================================================================
# PostgreSQL Production Configuration Reference (PITR & WAL Archiving)
# ------------------------------------------------------------------------------
# Reference baseline for self-managed PostgreSQL (or custom CloudNativePG image)
# supporting LangGraph checkpoints, LongTermStore memory, and pgvector / audit
# durability. Requires external WAL archiving target configured via environment
# (e.g. pgBackRest / WAL-G) — never hardcode cloud credentials here.
# ==============================================================================

# Connection & Pooling Compatibility (paired with deploy/k8s/pgbouncer.yaml)
listen_addresses = '*'
max_connections = 200
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 256MB

# Write-Ahead Log & Point-in-Time Recovery (PITR)
wal_level = replica
archive_mode = on
# Example parameterized WAL-G / pgBackRest archival hook:
#   wal-g wal-push "%p"  (reads WALG_S3_PREFIX & IAM/IRSA from pod environment)
archive_command = '/usr/local/bin/wal-g wal-push "%p"'
archive_timeout = 60
max_wal_senders = 5
wal_keep_size = 1024MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9

# Crash Recovery & Data Integrity
full_page_writes = on
synchronous_commit = on
wal_log_hints = on

# Observability & Slow-Query Diagnostics
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_min_duration_statement = 500
log_checkpoints = on
log_lock_waits = on
