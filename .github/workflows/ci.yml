name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Quality & Security Audit
  # ----------------------------------------------------------------------------
  lint-and-audit:
    name: Lint, Type Check & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dev Dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system pip-audit

      - name: Lint Code (ruff)
        run: ruff check src/ tests/

      - name: Type Check (mypy)
        run: mypy src/

      - name: Production Dependency Vulnerability Scan (pip-audit)
        run: |
          # Audit the frozen production graph. Development-only evaluation
          # dependencies (for example RAGAS) are not shipped in runtime images.
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --output-file "$RUNNER_TEMP/production-requirements.txt"
          pip-audit --desc on \
            --requirement "$RUNNER_TEMP/production-requirements.txt"

  # ----------------------------------------------------------------------------
  # 2. Test & Evaluation Quality Gate
  # ----------------------------------------------------------------------------
  test-and-eval:
    name: Test Suite & Quality Evaluation Gate
    needs: [lint-and-audit]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agentic_db
          POSTGRES_USER: agentic_user
          POSTGRES_PASSWORD: agentic_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: "test"
      CI: "true"
      POSTGRES_URI: "postgresql://agentic_user:agentic_password@localhost:5432/agentic_db"
      REDIS_URI: "redis://localhost:6379/0"
      ALLOW_LOCAL_AGENT_FALLBACK: "true"
      ALLOW_HOST_CODE_EXECUTION: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dev Dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Setup NLTK Data & Permissions
        run: |
          mkdir -p "$HOME/nltk_data"
          python -m nltk.downloader stopwords punkt punkt_tab -d "$HOME/nltk_data"
          chmod -R go-w $(python -c "import site; print(site.getsitepackages()[0])")

      - name: Ingest Knowledge Base
        run: python scripts/ingest.py

      - name: Verify Database Migrations (Alembic)
        run: python scripts/migrate_db.py

      - name: Run Unit & Integration Tests (pytest, 80% coverage floor)
        run: pytest tests/ -n auto -v --cov=src --cov-report=term-missing --cov-fail-under=80
        env:
          ENABLE_DOCKER_SANDBOX: "false"

      - name: Run Smoke Quality Benchmark (NOT a release gate)
        run: python evals/run_eval.py --mode smoke
        env:
          ENVIRONMENT: "test"
          CI: "true"

      - name: Generate PRR Machine Evidence (commit SHA + exit codes)
        run: python scripts/generate_prr_evidence.py
        env:
          ENVIRONMENT: "test"
          CI: "true"

      - name: Upload PRR Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prr-evidence-${{ github.sha }}
          path: evidence/prr/latest.json
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # 3. Container Build, Hardening & Security Scan
  # ----------------------------------------------------------------------------
  build-and-scan:
    name: Container Build & Trivy Vulnerability Scan
    needs: [test-and-eval]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: api
            dockerfile: deploy/docker/Dockerfile.api
          - name: agent
            dockerfile: deploy/docker/Dockerfile.agent
          - name: mcp
            dockerfile: deploy/docker/Dockerfile.mcp
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          load: true
          tags: ${{ matrix.component.name }}:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.component.name }}:local-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 4. Continuous Deployment: Publish to GHCR & GitOps Manifest Update
  # ----------------------------------------------------------------------------
  publish-and-deploy:
    name: Publish Images to GHCR & CD Sync
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPO_LOWER }}/api
            ghcr.io/${{ env.REPO_LOWER }}/agent
            ghcr.io/${{ env.REPO_LOWER }}/mcp

      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/api:latest

      - name: Build and Push Agent Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/agent:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/agent:latest

      - name: Build and Push MCP Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/mcp:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/mcp:latest

      - name: Validate Kubernetes Manifests & GitOps Definitions
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          kubectl kustomize deploy/k8s > /tmp/agentic-manifests.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/agentic-manifests.yaml

      - name: Verify Release Sign-off & PRR Attestation Artifacts
        id: signoff
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Auto-deploy is only permitted with a committed, valid sign-off and
          # machine-generated PRR evidence. Otherwise release stays MANUAL.
          if python - <<'PY'
          import json, pathlib, sys
          required = [
              pathlib.Path("evidence/prr/latest.json"),
              pathlib.Path("evidence/signoff/release-board.json"),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              print("::warning::Missing sign-off/attestation artifacts: " + ", ".join(missing))
              sys.exit(2)
          for p in required:
              payload = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(payload, dict):
                  raise SystemExit(f"Invalid attestation payload: {p}")
          print("Sign-off and PRR attestation artifacts verified.")
          PY
          then
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: GitOps Image Tag Auto-Update & ArgoCD Sync (requires sign-off)
        if: startsWith(github.ref, 'refs/tags/v') && steps.signoff.outputs.approved == 'true'
        run: |
          echo "Release tag detected: ${{ github.ref_name }}. Sign-off verified."
          echo "Updating deployment image references with immutable SHA: ${{ github.sha }}..."
          sed -i "s|image: ghcr.io/agentic-platform/api:latest|image: ghcr.io/${REPO_LOWER}/api:${{ github.sha }}|g" deploy/k8s/deployment.yaml
          sed -i "s|image: ghcr.io/agentic-platform/agent:latest|image: ghcr.io/${REPO_LOWER}/agent:${{ github.sha }}|g" deploy/k8s/deployment.yaml
          sed -i "s|image: ghcr.io/agentic-platform/mcp:latest|image: ghcr.io/${REPO_LOWER}/mcp:${{ github.sha }}|g" deploy/k8s/deployment.yaml
          git config user.name "agentic-release-bot"
          git config user.email "agentic-release-bot@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml
          git commit -m "chore(deploy): pin release images to ${{ github.sha }} [skip ci]"
          git push origin HEAD:main
