name: CI/CD Production Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # 1. Quality & Security Audit
  # ----------------------------------------------------------------------------
  lint-and-audit:
    name: Lint, Type Check & Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Dev Dependencies
        run: uv sync --frozen --dev --extra dev

      - name: Lint Code (ruff)
        run: uv run ruff check src/ tests/

      - name: Type Check (mypy)
        run: uv run mypy src/

      - name: Production Dependency Vulnerability Scan (pip-audit)
        run: uv run python scripts/audit_dependencies.py

      - name: Render Kubernetes Manifests
        run: kubectl kustomize deploy/k8s > "$RUNNER_TEMP/agentic-manifests.yaml"

  # ----------------------------------------------------------------------------
  # 2. Test & Evaluation Quality Gate
  # ----------------------------------------------------------------------------
  test-and-eval:
    name: Test Suite & Quality Evaluation Gate
    needs: [lint-and-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Dev Dependencies
        run: uv sync --frozen --dev --extra dev

      - name: Setup NLTK Data & Permissions
        run: |
          mkdir -p "$HOME/nltk_data"
          uv run python -m nltk.downloader stopwords punkt punkt_tab -d "$HOME/nltk_data"
          chmod -R go-w $(uv run python -c "import site; print(site.getsitepackages()[0])")

      - name: Ingest Knowledge Base
        run: uv run python scripts/ingest.py

      - name: Verify Database Migrations (Alembic)
        run: uv run python scripts/migrate_db.py

      - name: Run Unit & Integration Tests (pytest)
        run: uv run pytest tests/ -v --cov=src --cov-report=term-missing
        env:
          ENABLE_DOCKER_SANDBOX: "false"

      - name: Run Quality Gate Benchmark (Routing, Groundedness, Faithfulness)
        run: uv run python evals/run_eval.py

  # ----------------------------------------------------------------------------
  # 3. Container Build, Hardening & Security Scan
  # ----------------------------------------------------------------------------
  build-and-scan:
    name: Container Build & Trivy Vulnerability Scan
    needs: [test-and-eval]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - name: api
            dockerfile: deploy/docker/Dockerfile.api
          - name: agent
            dockerfile: deploy/docker/Dockerfile.agent
          - name: mcp
            dockerfile: deploy/docker/Dockerfile.mcp
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Local Container Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          load: true
          tags: ${{ matrix.component.name }}:local-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: '${{ matrix.component.name }}:local-test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ----------------------------------------------------------------------------
  # 4. Continuous Deployment: Publish to GHCR & GitOps Manifest Update
  # ----------------------------------------------------------------------------
  publish-and-deploy:
    name: Publish Images to GHCR & CD Sync
    needs: [build-and-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        run: |
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            ghcr.io/${{ env.REPO_LOWER }}/api
            ghcr.io/${{ env.REPO_LOWER }}/agent
            ghcr.io/${{ env.REPO_LOWER }}/mcp

      - name: Build and Push API Image
        id: build-api
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/api:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/api:latest

      - name: Build and Push Agent Image
        id: build-agent
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile.agent
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/agent:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/agent:latest

      - name: Build and Push MCP Image
        id: build-mcp
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: deploy/docker/Dockerfile.mcp
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}/mcp:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}/mcp:latest

      - name: Validate Kubernetes Manifests & GitOps Definitions
        run: |
          curl -fsSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          kubectl kustomize deploy/k8s > /tmp/agentic-manifests.yaml
          ./kubeconform -strict -summary -ignore-missing-schemas /tmp/agentic-manifests.yaml

      - name: GitOps Image Tag Auto-Update & ArgoCD Sync
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Release tag detected: ${{ github.ref_name }}."
          echo "Updating deployment image references with immutable registry digests..."
          sed -i -E "s|image: ghcr.io/.*/api(@sha256:[a-f0-9]{64}|:[^[:space:]]+)|image: ghcr.io/${REPO_LOWER}/api@${{ steps.build-api.outputs.digest }}|g" deploy/k8s/deployment.yaml
          sed -i -E "s|image: ghcr.io/.*/agent(@sha256:[a-f0-9]{64}|:[^[:space:]]+)|image: ghcr.io/${REPO_LOWER}/agent@${{ steps.build-agent.outputs.digest }}|g" deploy/k8s/deployment.yaml
          sed -i -E "s|image: ghcr.io/.*/mcp(@sha256:[a-f0-9]{64}|:[^[:space:]]+)|image: ghcr.io/${REPO_LOWER}/mcp@${{ steps.build-mcp.outputs.digest }}|g" deploy/k8s/deployment.yaml
          git config user.name "agentic-release-bot"
          git config user.email "agentic-release-bot@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml
          git commit -m "chore(deploy): pin release images to ${{ github.sha }} [skip ci]"
          git push origin HEAD:main
