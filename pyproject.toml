[project]
name = "agentic-platform"
version = "0.1.0"
description = "Hierarchical Multi-Agent Platform with LangGraph, vLLM, llama.cpp, LlamaIndex, FastMCP, and A2A Protocol"
authors = [{ name = "Agentic Team", email = "dev@agentic-platform.local" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API & Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "httpx2>=2.0.0",
    "sse-starlette>=2.1.3",
    # LangGraph & LangChain
    "langgraph>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    # MCP (Model Context Protocol; requires v2 MCPServer / streamable_http_client)
    "mcp>=2.0.0",
    # RAG & LlamaIndex
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-llms-openai>=0.3.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    # Storage & Persistence
    "psycopg[binary,pool]>=3.2.3",
    "qdrant-client>=1.12.0",
    "redis>=5.2.0",
    "alembic>=1.13.0",
    # Observability & Metrics
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # OTLPSpanExporter requires this distribution.
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.21.0",
    # Temporal for Durable Workflows
    "temporalio>=1.7.1",
    # Utilities
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.12",
    "langsmith>=0.1.0",
    # Ed25519 approval capabilities (explicit runtime dependency).
    "cryptography>=43.0.0",
    # Regex engine with per-match timeout for untrusted repository searches.
    "regex>=2024.11.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
    "datasets>=2.19.0",
    "locust==2.47.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]
eval = [
    # Isolated release-evaluation tooling; never shipped in runtime images.
    "ragas>=0.2.0",
]
# Optional neural retrieval stack. Release gates require it; the default
# installation intentionally stays light and uses honestly-labelled heuristics.
neural = [
    "torch>=2.6.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
]
# Installed only by the strict release-gate job so DeepEval runs real metrics.
deepeval = [
    "deepeval>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "ASYNC", "B", "C4", "RUF", "SIM", "UP"]
ignore = [
    "ASYNC109", # Explicit timeout parameters are part of public async APIs.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Standalone runners intentionally bootstrap the repository root before imports.
"evals/*.py" = ["E402"]
# FastAPI evaluates dependency descriptors in function signatures by design.
"src/agentic/api/deps.py" = ["B008"]
"src/agentic/api/routes/*.py" = ["B008"]
# Nested patch contexts make the intended mock lifetimes clearer in tests.
"tests/**/*.py" = ["SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*langchain-community.*is being sunset:DeprecationWarning",
    "ignore:coroutine 'AsyncMockMixin.*' was never awaited:RuntimeWarning",
]

[dependency-groups]
dev = [
    "datasets>=2.19.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
